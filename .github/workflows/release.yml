name: Release
run-name: EffectCraft public community release (${{ github.ref_name }})

on:
  push:
    branches:
      - release
      - release/community-downloads
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (defaults to the first fork release)"
        type: string
        default: "0.13.1"
      has-macos:
        description: "Build macOS universal"
        type: boolean
        default: false
      has-windows-x64:
        description: "Build Windows x64"
        type: boolean
        default: true
      has-windows-x86:
        description: "Build Windows x86"
        type: boolean
        default: true
      has-windows-arm64:
        description: "Build Windows ARM64"
        type: boolean
        default: true
      has-linux-x86_64:
        description: "Build Linux x86_64"
        type: boolean
        default: true
      has-linux-aarch64:
        description: "Build Linux ARM64"
        type: boolean
        default: true
      has-flatpak-x86_64:
        description: "Build Flatpak x86_64 (requires Linux x86_64)"
        type: boolean
        default: true
      has-flatpak-aarch64:
        description: "Build Flatpak ARM64 (requires Linux ARM64)"
        type: boolean
        default: true
      has-arch:
        description: "Enable Arch Linux packaging"
        type: boolean
        default: true
      has-arch-x86_64:
        description: "Build Arch Linux x86_64 (requires Linux x86_64)"
        type: boolean
        default: true
      has-arch-aarch64:
        description: "Build Arch Linux ARM64 (requires Linux ARM64)"
        type: boolean
        default: true
      has-web:
        description: "Build WebAssembly"
        type: boolean
        default: true
      has-riscv64:
        description: "Build Linux riscv64"
        type: boolean
        default: true
      has-freebsd:
        description: "Build FreeBSD"
        type: boolean
        default: true
      has-server:
        description: "Build the headless Linux server"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-builds.yml
    with:
      app-name: effectcraft
      app-title: EffectCraft
      # The first fork release builds Windows x64, Linux x86_64 and Web. Bump this version
      # before triggering a second release on the release branch.
      version: ${{ github.event_name == 'push' && '0.13.1' || inputs.version }}
      has-macos: ${{ github.event_name == 'workflow_dispatch' && inputs.has-macos }}
      has-windows-x64: ${{ github.event_name == 'push' || inputs.has-windows-x64 }}
      has-windows-x86: ${{ github.event_name == 'workflow_dispatch' && inputs.has-windows-x86 }}
      has-windows-arm64: ${{ github.event_name == 'workflow_dispatch' && inputs.has-windows-arm64 }}
      has-linux-x86_64: ${{ github.event_name == 'push' || inputs.has-linux-x86_64 }}
      has-linux-aarch64: ${{ github.event_name == 'workflow_dispatch' && inputs.has-linux-aarch64 }}
      has-flatpak-x86_64: ${{ github.event_name == 'workflow_dispatch' && inputs.has-flatpak-x86_64 }}
      has-flatpak-aarch64: ${{ github.event_name == 'workflow_dispatch' && inputs.has-flatpak-aarch64 }}
      has-arch: ${{ github.event_name == 'workflow_dispatch' && inputs.has-arch }}
      has-arch-x86_64: ${{ github.event_name == 'workflow_dispatch' && inputs.has-arch-x86_64 }}
      has-arch-aarch64: ${{ github.event_name == 'workflow_dispatch' && inputs.has-arch-aarch64 }}
      has-web: ${{ github.event_name == 'push' || inputs.has-web }}
      has-riscv64: ${{ github.event_name == 'workflow_dispatch' && inputs.has-riscv64 }}
      has-freebsd: ${{ github.event_name == 'workflow_dispatch' && inputs.has-freebsd }}
      has-server: ${{ github.event_name == 'workflow_dispatch' && inputs.has-server }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
